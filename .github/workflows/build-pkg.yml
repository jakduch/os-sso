name: Build & Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      force_version:
        description: "Force a specific version (optional, format: YYYY.M.X)"
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub release after a manual build"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGIN_NAME: sso
  PLUGIN_CATEGORY: security

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      do_release: ${{ steps.v.outputs.do_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Version pattern: YEAR.MONTH_INDEX.RELEASE_INDEX (e.g. 2026.6.3).
      #   - tag push  v*.*.*  -> version taken from the tag, publish a release
      #   - workflow_dispatch -> force_version, or next auto index for this month
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF}" != "${REF#refs/tags/}" ]; then
            TAG="${REF#refs/tags/}"
            VERSION="${TAG#v}"
            DO_RELEASE=true
          elif [ -n "${FORCE_VERSION}" ]; then
            VERSION="${FORCE_VERSION#v}"
            DO_RELEASE="${PUBLISH_RELEASE:-false}"
          else
            git fetch --tags --force
            YEAR_MONTH=$(date +'%Y.%-m')                                  # 2026.6
            LATEST_TAG=$(git tag -l "v${YEAR_MONTH}.*" | sort -V | tail -n 1)
            if [ -z "${LATEST_TAG}" ]; then
              VERSION="${YEAR_MONTH}.1"
            else
              VERSION="${YEAR_MONTH}.$(( ${LATEST_TAG##*.} + 1 ))"
            fi
            DO_RELEASE=false
          fi

          # Normalise each segment (strip leading zeros): 2026.06.1 -> 2026.6.1
          VERSION=$(echo "${VERSION}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "do_release=${DO_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "::notice::os-sso ${VERSION} (tag ${TAG}, release=${DO_RELEASE})"

  build:
    name: Build package (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      # One leg per FreeBSD MAJOR that OPNsense targets. pkg's ABI check is on the
      # major only (FreeBSD:14 vs FreeBSD:15), so one build per major covers every
      # minor of that major. Pick a minor <= the OPNsense base's minor to avoid the
      # bypassable "Newer FreeBSD version" (OSVERSION) warning. When OPNsense rebases
      # to a new major, add a line here -- no other change needed.
      #   OPNsense 25.7 / 26.x -> FreeBSD 14.x  |  future OPNsense -> FreeBSD 15.x
      matrix:
        include:
          # opnsense: the OLDEST supported OPNsense whose pkg we align with (see the
          # "Align pkg" note below). Empty when OPNsense has no build for that major yet.
          # php: the PHP major that OPNsense base ships for this ABI, and therefore
          # the php<major>-* packages this .pkg must depend on. Verified against
          # pkg.opnsense.org: 25.7 and 26.1 on FreeBSD:14 carry php83, 26.7 on
          # FreeBSD:15 carries php85. Mk/defaults.mk would derive it from the build
          # host's own php, and this VM has none -- hence passing it explicitly.
          - freebsd: "14.3"
            abi: "FreeBSD-14"
            opnsense: "25.7"
            php: "83"
            plugins_ref: "stable/26.1"
          - freebsd: "15.1"
            abi: "FreeBSD-15"
            opnsense: ""
            php: "85"
            plugins_ref: "stable/26.7"
    steps:
      - name: Clone the opnsense/plugins tree
        env:
          PLUGINS_REF: ${{ matrix.plugins_ref }}
        run: git clone --depth 1 --branch "${PLUGINS_REF}" https://github.com/opnsense/plugins.git "${GITHUB_WORKSPACE}/plugins"

      - name: Checkout os-sso into the plugins tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugins/${{ env.PLUGIN_CATEGORY }}/${{ env.PLUGIN_NAME }}

      - name: Substitute PLUGIN_VERSION in the Makefile
        run: |
          MF="plugins/${PLUGIN_CATEGORY}/${PLUGIN_NAME}/Makefile"
          sed -i "s|^PLUGIN_VERSION=.*|PLUGIN_VERSION=\t${{ needs.prepare.outputs.version }}|" "$MF"
          grep '^PLUGIN_VERSION' "$MF"

      - name: Vendor composer deps on the host
        # The build VM stays composer-free; we vendor here and the Makefile's
        # post-extract detects vendor/ and skips composer inside FreeBSD.
        #
        # From the lock file, not from the constraints: these two libraries are the
        # signature verification of the whole plugin, so which exact versions a release
        # shipped has to be a fact in git rather than whatever resolved that morning.
        # And since it is pinned, the advisories can be checked against it -- a build
        # that would ship a known-vulnerable php-saml is a build worth failing.
        run: |
          cd "plugins/${PLUGIN_CATEGORY}/${PLUGIN_NAME}/src/opnsense/mvc/app/library/OPNsense/SSO"
          test -f composer.lock
          composer audit --locked --no-interaction
          # --no-scripts/--no-plugins: nothing here defines either, so running them is
          # only ever somebody else's code executing on the release runner.
          composer install --no-dev --no-interaction --classmap-authoritative \
            --ignore-platform-reqs --no-scripts --no-plugins
          test -f vendor/autoload.php

      - name: Build the .pkg in a FreeBSD VM
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1
        env:
          OPNSENSE_REL: ${{ matrix.opnsense }}
          PLUGIN_PHP: ${{ matrix.php }}
        with:
          envs: "PLUGIN_NAME PLUGIN_CATEGORY OPNSENSE_REL PLUGIN_PHP"
          usesh: true
          release: ${{ matrix.freebsd }}
          prepare: |
            ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            pkg install -y git gmake
            if [ -n "${OPNSENSE_REL}" ]; then
              BASE="https://pkg.opnsense.org/FreeBSD:14:amd64/${OPNSENSE_REL}/latest/All"
              PKGFILE=$(fetch -qo - "${BASE}/" | grep -oE 'pkg-[0-9][^"]*\.pkg' | sort -V | tail -n 1)
              echo ">>> will repackage with OPNsense ${OPNSENSE_REL} pkg: ${PKGFILE}"
              fetch -o /tmp/opnpkg.pkg "${BASE}/${PKGFILE}"
            fi
          run: |
            set -e
            echo ">>> make package with pkg $(pkg -v), php${PLUGIN_PHP}"
            git config --global --add safe.directory '*'
            cd plugins/$PLUGIN_CATEGORY/$PLUGIN_NAME
            # On the command line so it beats the ?= in Mk/defaults.mk, which has no
            # php here to derive a value from.  This maintained repository publishes
            # the production package name os-sso; plugins.mk automatically declares
            # os-sso-devel as a conflict.
            make package PLUGIN_PHP="${PLUGIN_PHP}"
            ls -la work/pkg/
            if [ -n "${OPNSENSE_REL}" ]; then
              echo ">>> re-creating the artifact with OPNsense's pkg (so its pkg can extract it)"
              # extract OPNsense's static pkg without touching the system pkg/DB
              rm -rf /tmp/oldpkg && mkdir -p /tmp/oldpkg
              tar -xf /tmp/opnpkg.pkg -C /tmp/oldpkg
              OLDPKG=/tmp/oldpkg/usr/local/sbin/pkg-static
              "$OLDPKG" -v
              NEW=$(ls work/pkg/*.pkg | head -n 1)
              rm -rf /tmp/rb && mkdir -p /tmp/rb/stage /tmp/rb/out /tmp/rb/edb
              tar -xf "$NEW" -C /tmp/rb +MANIFEST
              tar -xf "$NEW" -C /tmp/rb/stage --exclude '+MANIFEST' --exclude '+COMPACT_MANIFEST'
              # create-only with an isolated empty DB -> no schema skew, no extraction
              env PKG_DBDIR=/tmp/rb/edb "$OLDPKG" create -M /tmp/rb/+MANIFEST -r /tmp/rb/stage -o /tmp/rb/out
              rm -f work/pkg/*.pkg
              cp /tmp/rb/out/*.pkg work/pkg/
              echo ">>> repackaged with $("$OLDPKG" -v):"; ls -la work/pkg/
            fi
            BUILT=$(ls work/pkg/*.pkg | head -n 1)
            tar -xOf "$BUILT" +COMPACT_MANIFEST > /tmp/os-sso-package-manifest
            cat /tmp/os-sso-package-manifest
            grep -Eq '"name"[[:space:]]*:[[:space:]]*"os-sso"' /tmp/os-sso-package-manifest
            grep -Eq '"product_conflicts"[[:space:]]*:[[:space:]]*"os-sso-devel"' \
              /tmp/os-sso-package-manifest
            tar -tf "$BUILT" > /tmp/os-sso-package-contents
            grep -Eq '^/?usr/local/share/licenses/os-sso/LICENSE$' /tmp/os-sso-package-contents
            grep -Eq '^/?usr/local/share/doc/os-sso/NOTICE.md$' /tmp/os-sso-package-contents
            if grep -Eq '^/?usr/local/usr/local/' /tmp/os-sso-package-contents; then
              echo ">>> invalid duplicated /usr/local prefix in package" >&2
              exit 1
            fi

      - name: Tag the .pkg filename with its ABI
        # Both matrix legs emit the same os-sso-<version>.pkg name; append the
        # ABI so the release can carry both without a filename collision.
        run: |
          PKGDIR="plugins/${PLUGIN_CATEGORY}/${PLUGIN_NAME}/work/pkg"
          for f in "${PKGDIR}"/*.pkg; do
            mv "$f" "${PKGDIR}/$(basename "$f" .pkg)-${{ matrix.abi }}.pkg"
          done
          ls -la "${PKGDIR}"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: os-${{ env.PLUGIN_NAME }}-${{ needs.prepare.outputs.version }}-${{ matrix.abi }}
          path: plugins/${{ env.PLUGIN_CATEGORY }}/${{ env.PLUGIN_NAME }}/work/pkg/*.pkg
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.do_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for the changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download the built packages (all ABIs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: os-${{ env.PLUGIN_NAME }}-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Latest existing tag, excluding the one we are about to publish.
          PREVIOUS_TAG=$(git tag -l --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)

          {
            echo "## os-sso ${VERSION}"
            echo ""
          } > release_notes.md

          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "### Commits" >> release_notes.md
            echo "" >> release_notes.md
            git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:"- %h %s" --max-count=5 >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md

            echo "### Pull requests" >> release_notes.md
            echo "" >> release_notes.md
            gh pr list --repo "${REPO}" --state merged --base main --limit 5 \
              --search "merged:>=$(git log -1 --format=%aI "${PREVIOUS_TAG}")" \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"' >> release_notes.md || true
            echo "" >> release_notes.md
            echo "" >> release_notes.md

            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}" >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

          cat release_notes.md

      - name: Generate package checksums
        run: |
          cd dist
          sha256sum -- *.pkg > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release_notes.md
          files: |
            dist/*.pkg
            dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}

  repository:
    name: Sign repository (${{ matrix.repo_abi }})
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.do_release == 'true'
    environment: pkg-repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - freebsd: "14.3"
            artifact_abi: "FreeBSD-14"
            repo_abi: "FreeBSD:14:amd64"
            archive: "repository-FreeBSD-14.tar.gz"
            opnsense: "25.7"
          - freebsd: "15.1"
            artifact_abi: "FreeBSD-15"
            repo_abi: "FreeBSD:15:amd64"
            archive: "repository-FreeBSD-15.tar.gz"
            opnsense: ""
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: os-${{ env.PLUGIN_NAME }}-${{ needs.prepare.outputs.version }}-${{ matrix.artifact_abi }}
          path: dist

      - name: Build and sign pkg catalogue
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1
        env:
          REPO_ABI: ${{ matrix.repo_abi }}
          REPO_ARCHIVE: ${{ matrix.archive }}
          OPNSENSE_REL: ${{ matrix.opnsense }}
          PKG_REPO_SIGNING_KEY_B64: ${{ secrets.PKG_REPO_SIGNING_KEY_B64 }}
        with:
          envs: "REPO_ABI REPO_ARCHIVE OPNSENSE_REL PKG_REPO_SIGNING_KEY_B64"
          usesh: true
          release: ${{ matrix.freebsd }}
          prepare: |
            ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            if [ -n "${OPNSENSE_REL}" ]; then
              BASE="https://pkg.opnsense.org/FreeBSD:14:amd64/${OPNSENSE_REL}/latest/All"
              PKGFILE=$(fetch -qo - "${BASE}/" | grep -oE 'pkg-[0-9][^"]*\.pkg' | sort -V | tail -n 1)
              test -n "${PKGFILE}"
              fetch -o /tmp/opnpkg.pkg "${BASE}/${PKGFILE}"
            fi
          run: |
            set -eu
            test -n "${PKG_REPO_SIGNING_KEY_B64}"
            SITE="repository-site/pkg/${REPO_ABI}"
            mkdir -p "${SITE}"
            cp dist/*.pkg "${SITE}/"
            printf '%s' "${PKG_REPO_SIGNING_KEY_B64}" \
              | openssl enc -base64 -d -A > /tmp/os-sso-repository.key
            chmod 600 /tmp/os-sso-repository.key
            REPO_PKG=/usr/local/sbin/pkg
            if [ -n "${OPNSENSE_REL}" ]; then
              mkdir -p /tmp/opnpkg
              tar -xf /tmp/opnpkg.pkg -C /tmp/opnpkg
              REPO_PKG=/tmp/opnpkg/usr/local/sbin/pkg-static
            fi
            "${REPO_PKG}" -v
            "${REPO_PKG}" repo "${SITE}" /tmp/os-sso-repository.key
            rm -f /tmp/os-sso-repository.key
            sha256 -q "${SITE}"/*.pkg > "${SITE}/PACKAGE.SHA256"
            find "${SITE}" -maxdepth 1 -type f -print | sort
            # upload-artifact rejects ':' in paths for cross-platform reasons.
            # Preserve pkg's canonical FreeBSD:<major>:amd64 layout inside one
            # portable archive, then extract it on the Pages runner.
            tar -czf "${REPO_ARCHIVE}" -C repository-site .

      - name: Upload signed repository subtree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-repository-${{ matrix.artifact_abi }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  assemble-repository:
    name: Assemble Pages repository
    runs-on: ubuntu-latest
    needs: [prepare, repository]
    if: needs.prepare.outputs.do_release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download both signed catalogues
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pkg-repository-*
          merge-multiple: true
          path: _archives

      - name: Restore canonical pkg repository paths
        run: |
          mkdir -p _site
          for archive in _archives/repository-FreeBSD-*.tar.gz; do
            tar -xzf "$archive" -C _site
          done
          test -d '_site/pkg/FreeBSD:14:amd64'
          test -d '_site/pkg/FreeBSD:15:amd64'

      - name: Add bootstrap and public trust material
        run: |
          install -m 0644 repository/index.html _site/index.html
          install -m 0644 repository/os-sso.pub _site/os-sso.pub
          install -m 0644 repository/JakduchOSSSO.conf _site/JakduchOSSSO.conf
          install -m 0755 repository/bootstrap.sh _site/bootstrap.sh
          install -m 0755 repository/reinstall.sh _site/reinstall.sh
          test "$(sha256sum _site/os-sso.pub | awk '{print $1}')" = \
            "3efc7a48172fb2f5efe0249de9064c771b902876e43332af28871a04b8b486e7"
          find _site -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy-repository:
    name: Publish signed repository
    runs-on: ubuntu-latest
    needs: [release, assemble-repository]
    if: needs.release.result == 'success' && needs.assemble-repository.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
