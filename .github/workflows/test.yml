name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: PHP 8.3 unit and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.3"
          extensions: curl, dom, gettext, mbstring, openssl, simplexml, xml
          coverage: none

      - name: Validate and install locked dependencies
        working-directory: src/opnsense/mvc/app/library/OPNsense/SSO
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-interaction
          composer install --no-dev --no-interaction --classmap-authoritative \
            --no-scripts --no-plugins

      - name: Check PHP syntax
        run: find src test -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check package script syntax
        run: |
          sh -n ./+POST_INSTALL.post ./+PRE_DEINSTALL.post repository/bootstrap.sh \
            tools/extract-strings.sh test/package_scripts.sh
          shellcheck -x ./+POST_INSTALL.post ./+PRE_DEINSTALL.post \
            repository/bootstrap.sh tools/extract-strings.sh \
            src/opnsense/scripts/OPNsense/SSO/*.sh \
            src/etc/rc.d/os-sso-vpn-guard
          sh test/package_scripts.sh

      - name: Verify repository trust material
        run: |
          test "$(sha256sum repository/os-sso.pub | awk '{print $1}')" = \
            "3efc7a48172fb2f5efe0249de9064c771b902876e43332af28871a04b8b486e7"
          openssl pkey -pubin -in repository/os-sso.pub -noout -check

      - name: Run unit suite without skipped state tests
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /var/db/os-sso
          php test/unit/run.php
          python3 test/unit/test_vpn_guard.py

      - name: Static security analysis
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --config p/security-audit --config p/php --config p/python \
            --exclude 'src/opnsense/mvc/app/library/OPNsense/SSO/vendor/**' \
            --exclude 'test/**' --error --metrics=off src
